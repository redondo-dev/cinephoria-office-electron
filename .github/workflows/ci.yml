name: CI Desktop

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

defaults:
  run:
    working-directory: electron-app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      - name: Installer les dependances
        run: npm ci

      # --- Audit de securite des dependances ---
      - name: Audit npm (dependances vulnerables)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint --if-present

  build-windows-exe:
    # Le packaging Electron (.exe) doit se faire sur un runner Windows
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Builder l'executable Windows
        run: npm run build:win
        # Le script "build:win" du package.json doit appeler
        # electron-builder --win (a adapter selon la config du projet).

      - name: Publier le .exe comme artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: cinephoria-desktop-windows
          path: electron-app/dist/*.exe

  publish-release:
    # Cree/actualise une GitHub Release avec le .exe attache,
    # uniquement lors d'un push de tag (ex: v1.0.0)
    needs: build-windows-exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Builder l'executable Windows
        run: npm run build:win

      - name: Publier la Release GitHub avec le .exe
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
